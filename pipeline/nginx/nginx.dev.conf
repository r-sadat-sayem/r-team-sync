# nginx.dev.conf — TeamSync AI development reverse proxy (no SSL)
# Used for local testing when you want everything behind a single port (8080).
# Not used by docker-compose.dev.yml by default (services run on their own ports).
# Usage: mount this as nginx config and expose port 8080.

worker_processes 1;

events { worker_connections 512; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile on;

    upstream frontend  { server frontend:3000; }
    upstream backend   { server backend:8000; }
    upstream n8n       { server n8n:5678; }
    upstream demo      { server demo:4040; }

    server {
        listen 8080;
        server_name localhost;

        location /api/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location ~ ^/(health|docs|redoc|openapi.json) {
            proxy_pass http://backend;
        }

        location /webhook/ {
            proxy_pass http://n8n;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_buffering off;
            proxy_read_timeout 3600s;
        }

        location /n8n/ {
            rewrite ^/n8n/(.*) /$1 break;
            proxy_pass http://n8n;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        location /demo/ {
            rewrite ^/demo/(.*) /$1 break;
            proxy_pass http://demo;
        }

        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
