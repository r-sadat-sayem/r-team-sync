# docker-compose.yml — TeamSync AI PRODUCTION stack
# Includes: PostgreSQL, n8n, FastAPI backend, Next.js frontend, Nginx reverse proxy, demo page
# Usage: make prod  OR  docker compose -f pipeline/docker/docker-compose.yml --env-file .env up -d

services:

  # ── PostgreSQL ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-n8n}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-teamsync}
    volumes:
      - teamsync_postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-n8n} -d ${DB_NAME:-teamsync}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # No port exposure — only internal network

  # ── n8n workflow engine ────────────────────────────────────────────────────
  n8n:
    image: n8nio/n8n:latest
    restart: always
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${DB_NAME:-teamsync}
      DB_POSTGRESDB_USER: ${DB_USER:-n8n}
      DB_POSTGRESDB_PASSWORD: ${DB_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: ${N8N_BASIC_AUTH_USER:-admin}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_BASIC_AUTH_PASSWORD}
      N8N_HOST: ${DOMAIN:-localhost}
      N8N_PORT: 5678
      N8N_PROTOCOL: https
      WEBHOOK_URL: https://${DOMAIN:-localhost}/
      EXECUTIONS_PROCESS: main
      N8N_RUNNERS_ENABLED: "true"
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: 720
      N8N_LOG_LEVEL: ${N8N_LOG_LEVEL:-info}
      N8N_METRICS: "true"
    volumes:
      - teamsync_n8n_data:/home/node/.n8n
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy

  # ── FastAPI backend ────────────────────────────────────────────────────────
  backend:
    image: teamsync-backend:latest
    restart: always
    environment:
      DATABASE_URL: postgresql+asyncpg://${DB_USER:-n8n}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-teamsync}
      N8N_BASE_URL: http://n8n:5678
      N8N_CHAT_WEBHOOK_ID: ${N8N_CHAT_WEBHOOK_ID:-unified-webhook-id}
      BACKEND_API_KEY: ${BACKEND_API_KEY}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL}
      AI_PROVIDER: ${AI_PROVIDER:-ollama}
      RAKUTEN_AI_API_URL: ${RAKUTEN_AI_API_URL:-}
      RAKUTEN_AI_API_KEY: ${RAKUTEN_AI_API_KEY:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DEBUG: "false"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Next.js frontend ───────────────────────────────────────────────────────
  frontend:
    image: teamsync-frontend:latest
    restart: always
    environment:
      NEXT_PUBLIC_API_URL: https://${DOMAIN:-localhost}
      API_URL: http://backend:8000
      BACKEND_API_KEY: ${BACKEND_API_KEY}
    depends_on:
      - backend

  # ── Demo page ──────────────────────────────────────────────────────────────
  demo:
    image: teamsync-demo:latest
    restart: always
    environment:
      N8N_CHAT_URL: /webhook/${N8N_CHAT_WEBHOOK_ID:-unified-webhook-id}/chat
      N8N_UPSTREAM_BASE: http://n8n:5678
      DEMO_TITLE: ${DEMO_TITLE:-TeamSync AI}
      DEMO_BADGE: ${DEMO_BADGE:-Internal Build}

  # ── Nginx reverse proxy ────────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../../pipeline/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx_certs:/etc/letsencrypt:ro
      - nginx_webroot:/var/www/certbot:ro
    depends_on:
      - frontend
      - backend
      - n8n
      - demo

volumes:
  teamsync_postgres_data:
    external: true
  teamsync_n8n_data:
    external: true
  nginx_certs:
  nginx_webroot:
