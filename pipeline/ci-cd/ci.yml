# ci.yml — Continuous Integration
# Runs on every PR and push to main/develop.
# Jobs: validate-workflows, lint-backend, test-backend, lint-frontend, build-images

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # ── 1. Validate n8n workflow JSON files ──────────────────────────────────
  validate-workflows:
    name: Validate n8n Workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate all JSON workflow files
        run: |
          for f in *.json n8n/workflows/*.json; do
            [ -f "$f" ] || continue
            python3 -m json.tool "$f" > /dev/null && echo "✅ $f" || { echo "❌ $f"; exit 1; }
          done

  # ── 2. Backend: lint + type-check + tests ────────────────────────────────
  backend:
    name: Backend (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check src/ tests/
      - name: Type-check (mypy)
        run: mypy src/ --ignore-missing-imports
      - name: Run tests
        env:
          DATABASE_URL: sqlite+aiosqlite:///:memory:
          BACKEND_API_KEY: test-key
          N8N_BASE_URL: http://localhost:5678
          N8N_CHAT_WEBHOOK_ID: test-webhook
          AI_PROVIDER: mock
        run: pytest tests/ -v --tb=short --cov=src --cov-report=xml
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: backend/coverage.xml
          flags: backend

  # ── 3. Frontend: lint + type-check + build ───────────────────────────────
  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint (ESLint)
        run: npm run lint
      - name: Type-check
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
          NEXT_PUBLIC_N8N_CHAT_URL: /webhook/test/chat

  # ── 4. Docker build check (does not push) ────────────────────────────────
  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build --target production -t teamsync-backend:ci backend/
      - name: Build frontend image
        run: docker build --target production -t teamsync-frontend:ci frontend/
      - name: Build demo image
        run: docker build -t teamsync-demo:ci .
