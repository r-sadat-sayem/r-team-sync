# deploy-prod.yml — Deploy to production on push to main (or manual trigger)
# Requires manual approval via GitHub Environment protection rules.

name: Deploy — Production

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag to deploy (default: latest)
        required: false
        default: latest

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}/teamsync

jobs:
  deploy-prod:
    name: Build & Deploy to Production
    runs-on: ubuntu-latest
    environment: production   # Requires approval in GitHub repo settings
    steps:
      - uses: actions/checkout@v4

      - name: Set image tag
        run: echo "IMAGE_TAG=${{ github.event.inputs.tag || github.sha }}" >> $GITHUB_ENV

      # ── Build and push images ───────────────────────────────────────────
      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: backend
          target: production
          push: true
          tags: |
            ${{ env.REGISTRY }}-backend:latest
            ${{ env.REGISTRY }}-backend:${{ env.IMAGE_TAG }}

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: frontend
          target: production
          push: true
          tags: |
            ${{ env.REGISTRY }}-frontend:latest
            ${{ env.REGISTRY }}-frontend:${{ env.IMAGE_TAG }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.PROD_API_URL }}
            NEXT_PUBLIC_N8N_CHAT_URL=${{ secrets.PROD_CHAT_URL }}

      - name: Build and push demo
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.demo
          push: true
          tags: |
            ${{ env.REGISTRY }}-demo:latest
            ${{ env.REGISTRY }}-demo:${{ env.IMAGE_TAG }}

      # ── Deploy to production server ─────────────────────────────────────
      - name: Deploy to production via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            set -e
            cd ${{ secrets.PROD_DEPLOY_PATH }}

            # Backup before deploy
            bash pipeline/scripts/backup.sh

            # Pull latest images
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose -f docker-compose.yml pull

            # Zero-downtime rolling restart
            docker compose -f docker-compose.yml up -d --remove-orphans --no-recreate
            docker compose -f docker-compose.yml up -d --no-deps backend
            sleep 5
            docker compose -f docker-compose.yml exec -T backend alembic upgrade head
            docker compose -f docker-compose.yml up -d --no-deps frontend

            # Health check
            sleep 15
            curl -sf https://${{ secrets.PROD_DOMAIN }}/health || exit 1
            echo "Production deployment successful: ${{ env.IMAGE_TAG }}"

      - name: Notify Slack (success)
        if: success()
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {"text": "✅ Production deploy successful — ${{ github.actor }} deployed ${{ env.IMAGE_TAG }} to https://${{ secrets.PROD_DOMAIN }}"}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Notify Slack (failure)
        if: failure()
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {"text": "🚨 Production deploy FAILED — ${{ github.actor }} / ${{ env.IMAGE_TAG }} — <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View logs>"}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
