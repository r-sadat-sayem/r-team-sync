# TeamSync v2.0 — postgres + backend
# Usage:
#   cp backend/.env.example backend/.env   # fill in values
#   docker compose up --build -d           # -d keeps it running in background
#   docker compose logs -f backend         # tail logs
#   docker compose down                    # stop everything

services:

  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: teamsync
      POSTGRES_PASSWORD: teamsync
      POSTGRES_DB: teamsync
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teamsync"]
      interval: 5s
      retries: 10

  backend:
    build:
      context: backend
      target: development
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file: backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://teamsync:teamsync@postgres:5432/teamsync
    volumes:
      - ./backend/src:/app/src   # hot-reload
    depends_on:
      postgres:
        condition: service_healthy

  # Frontend — uncomment when ready to wire up React/Vite
  # frontend:
  #   build:
  #     context: ../frontend
  #   ports:
  #     - "5173:5173"
  #   environment:
  #     VITE_API_URL: http://localhost:8000
  #     VITE_API_KEY: dev-change-me

volumes:
  postgres_data:
